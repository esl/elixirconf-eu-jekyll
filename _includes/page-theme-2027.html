{% include theme-2027.html %}
<style id="page-theme-2027">
html,body{overflow-x:clip}
#speak,#cyb{background:#5a3181!important}
.ec27-sec{position:relative;background:var(--b)!important;box-shadow:0 0 0 100vmax var(--b);clip-path:inset(0 -100vmax);padding-top:2.5em!important;padding-bottom:2.5em!important;margin-top:0!important;margin-bottom:0!important}
.sw-sep{position:relative;line-height:0;pointer-events:none;overflow:hidden}
.sw-sep.bleed{width:calc(100vw - var(--sbw,0px));margin:-1px 0 -1px calc(50% - (100vw - var(--sbw,0px)) / 2)}
.sw-sep svg{display:block;width:100%;height:clamp(60px,8vw,130px)}
.sw-sep .s1,.sw-sep .s2,.sw-sep .s3{transform-box:view-box;transform-origin:50% 100%}
.sw-sep .s1{animation:pgdrift 15s ease-in-out infinite alternate}
.sw-sep .s2{animation:pgdrift 11s ease-in-out infinite alternate-reverse}
.sw-sep .s3{animation:pgdrift 8s ease-in-out infinite alternate}
@keyframes pgdrift{from{transform:scale(1.04,1) translateX(-1.1%)}to{transform:scale(1.04,1) translateX(1.1%)}}
@media (prefers-reduced-motion:reduce){.sw-sep g{animation:none!important;transform:scale(1.04,1)}}
#speak .facts>*,#cyb .facts>*{background:transparent!important;border:2px solid #80d2d2!important;color:#fff!important;box-shadow:none!important}
#speak .facts>*:first-child,#cyb .facts>*:first-child{background:#f0cf5a!important;border-color:#f0cf5a!important;color:#4d1484!important}
body a.btn-speak,body a.btn-apply{display:inline-block;background:#f0cf5a!important;color:#fff!important;border:0!important;border-radius:15px!important;padding:18px 40px!important;font-family:Montserrat,sans-serif!important;font-size:20px!important;font-weight:800!important;line-height:1.1!important;letter-spacing:.02em;text-transform:uppercase;text-decoration:none!important;box-shadow:none!important;transform:none!important;transition:background .2s,color .2s}
body a.btn-speak:hover,body a.btn-apply:hover{background:#fff!important;color:#5a3181!important}
body a.btn-ghost{background:transparent!important;border:3px solid #f0cf5a!important;color:#f0cf5a!important;border-radius:15px!important;text-decoration:none!important;box-shadow:none!important}
body a.btn-ghost:hover{background:#f0cf5a!important;color:#4d1484!important}
#speak .cards>*{position:relative;overflow:hidden;background:#7841ae!important;color:#fff!important;border:0!important;border-radius:28px!important;box-shadow:none!important;padding:28px 28px 40px!important}

#speak .cards>* p{position:relative;color:#fff!important;font-size:17px!important;line-height:1.5!important}

<script>
(function () {
var root = document.querySelector('#speak .wrap, #cyb .wrap');
if (!root) return;
document.documentElement.style.setProperty('--sbw', (window.innerWidth - document.documentElement.clientWidth) + 'px');
var secs = [].slice.call(root.children).filter(function (e) { return e.matches('.sec, .panel, .block'); });
if (!secs.length) return;
var cols = ['#7841ae', '#5a3181'];
function sep(prev, next) {
return '<div class="sw-sep bleed" aria-hidden="true" style="background:' + prev + '"><svg viewBox="0 480 1440 246" preserveAspectRatio="none" focusable="false">' +
'<g class="s1"><use href="#ec-hb" fill="#9878c1"/></g><g class="s2"><use href="#ec-hm" fill="#7841ae"/></g><g class="s3"><use href="#ec-hf" fill="' + next + '"/></g></svg></div>';
}
var prev = '#5a3181';
secs.forEach(function (s, i) {
var c = cols[i % 2];
s.classList.add('ec27-sec');
s.style.setProperty('--b', c);
s.insertAdjacentHTML('beforebegin', sep(prev, c));
prev = c;
});
var after = root.closest('section') || root.parentElement;
var nx = after.nextElementSibling;
while (nx && /^(SCRIPT|STYLE|SVG|svg)$/.test(nx.tagName)) nx = nx.nextElementSibling;
var m = nx && getComputedStyle(nx).backgroundColor.match(/\d+/g);
var nextCol = m && (m.length < 4 || +m[3] > 0) ? 'rgb(' + m[0] + ',' + m[1] + ',' + m[2] + ')' : '#201042';
secs[secs.length - 1].insertAdjacentHTML('afterend', sep(prev, nextCol));
})();
</script>
