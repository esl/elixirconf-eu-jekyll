<style>
#announcements{background:linear-gradient(180deg,#f6f2fb,#fff);height:auto;padding-bottom:3em}
#announcements .title{color:#201042}
#announcements .ann-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:28px;max-width:1140px;margin:0 auto;padding:0 20px;text-align:left}
#announcements .ann-card{background:#fff;border-radius:20px;box-shadow:0 14px 40px rgba(32,16,66,.14);padding:28px 26px;display:flex;flex-direction:column;transition:transform .25s,box-shadow .25s}
#announcements .ann-card:hover{transform:translateY(-6px);box-shadow:0 22px 50px rgba(32,16,66,.24)}
#announcements .ann-date{align-self:flex-start;background:#e94d8b;color:#fff;font-weight:800;font-size:13px;letter-spacing:.1em;text-transform:uppercase;padding:6px 14px;border-radius:999px;margin-bottom:16px}
#announcements .ann-card h3{color:#201042;font-weight:800;font-size:22px;line-height:1.25;margin:0 0 12px}
#announcements .ann-card p{color:#3a2a4d;font-size:16px;line-height:1.55;margin:0 0 22px;flex:1}
#announcements .ann-card a.ann-cta{align-self:flex-start;color:#ad3a8a;font-weight:800;letter-spacing:.06em;text-decoration:none;text-transform:uppercase;font-size:14px}
#announcements .ann-card a.ann-cta:hover{color:#201042}
#announcements .ann-more{text-align:center;margin-top:36px}
#announcements .ann-more a{display:inline-block;background:#e94d8b;color:#fff;font-weight:800;letter-spacing:.1em;padding:.9em 2.4em;border-radius:999px;text-decoration:none}
#announcements .ann-wrap{position:relative;width:100%;max-width:1200px;margin:0 auto;flex:0 0 100%}
#announcements .ann-wave{position:absolute;left:0;top:35%;width:100%;height:calc(65% + 150px);z-index:0;pointer-events:none;overflow:visible;-webkit-mask-image:linear-gradient(180deg,#000 50%,transparent 100%);mask-image:linear-gradient(180deg,#000 50%,transparent 100%)}
#announcements .ann-wave path{vector-effect:non-scaling-stroke}
#announcements .ann-wave .l1{fill:rgba(94,58,140,.10);animation:annsway 11s ease-in-out infinite alternate}
#announcements .ann-wave .l2{fill:rgba(151,105,201,.14);animation:annsway 8s ease-in-out infinite alternate-reverse}
#announcements .ann-wave .l3{fill:url(#annFill);animation:annsway 14s ease-in-out infinite alternate}
#announcements .ann-wave .edge{fill:none;stroke:rgba(255,255,255,.85);stroke-width:1.5px}
#announcements .ann-wave .glow{fill:none;stroke:url(#annGrad);stroke-width:12px;stroke-linecap:round;filter:blur(8px);stroke-dasharray:180 820;animation:annflow 8s linear infinite}
#announcements .ann-wave .core{fill:none;stroke:url(#annGrad);stroke-width:3px;stroke-linecap:round;stroke-dasharray:180 820;animation:annflow 8s linear infinite}
@keyframes annflow{from{stroke-dashoffset:180}to{stroke-dashoffset:-820}}
@keyframes annsway{from{transform:translateX(-2%)}to{transform:translateX(2%)}}
@media (prefers-reduced-motion:reduce){#announcements .ann-wave *{animation:none!important}}
#announcements .ann-grid{position:relative;z-index:1;width:100%}
#announcements .ann-more{flex:0 0 100%;width:100%;position:relative;z-index:2}
#announcements .ann-card,#announcements .ann-card *{text-align:left}
</style>
