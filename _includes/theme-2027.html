<style id="theme-2027-ds">

/* wide screens: keep content at a readable width instead of stretching */
@media (min-width:1400px){#banner-1>*,#volunteer>*,#welcome>*,#announcements>*,#sponsorship>*,#sponsors>*,#convince>*,#gallery-strip>*,#video>*,#venue>*,#tickets>*,#waiting-list>*,#contact>*,#speak>.wrap,#cyb>.wrap{max-width:1240px;margin-left:auto!important;margin-right:auto!important}}
