<!-- Section transitions 2027: the three hills from the main banner (same shapes as the hero) between every pair of sections.
The front hill takes the colour of the next section, so each section flows into the next. Hills drift gently; paused off screen and for prefers-reduced-motion. -->
<style>
.sw-sep{position:relative;line-height:0;margin:-1px 0;pointer-events:none;overflow:hidden}
.sw-sep svg{display:block;width:100%;height:clamp(60px,8vw,130px)}
.sw-sep .s1,.sw-sep .s2,.sw-sep .s3{transform-box:view-box;transform-origin:50% 100%}
.sw-sep .s1{animation:swdrift 15s ease-in-out infinite alternate}
.sw-sep .s2{animation:swdrift 11s ease-in-out infinite alternate-reverse}
.sw-sep .s3{animation:swdrift 8s ease-in-out infinite alternate}
.sw-sep.sw-paused g{animation-play-state:paused}
@keyframes swdrift{from{transform:scale(1.04,1) translateX(-1.1%)}to{transform:scale(1.04,1) translateX(1.1%)}}
@media (prefers-reduced-motion:reduce){.sw-sep g{animation:none!important;transform:scale(1.04,1)}}
.sw-on .section{padding-top:3.5em!important}
.sw-on .section.section--carousel{padding-top:2em!important}
#volunteer{background:#7841ae!important}
#convince{padding-top:48px!important}
#cft{background:#4d1484!important}
.sw-on #welcome::before,.sw-on #video::before,.sw-on #tickets::before,.sw-on #cft::before,.sw-on #cft::after,.sw-on #convince::before{display:none!important}
</style>
<script>
(function () {
function rgb(s) { var m = s.match(/rgba?\(\s*(\d+)[,\s]+(\d+)[,\s]+(\d+)(?:[,\/\s]+([\d.]+))?/); return m ? [+m[1], +m[2], +m[3], m[4] === undefined ? 1 : +m[4]] : null; }
function edge(el, side) {
var cs = getComputedStyle(el), c = rgb(cs.backgroundColor);
if (c && c[3] > 0.5) return c;
var all = (cs.backgroundImage.match(/rgba?\([^)]*\)/g) || []).map(rgb).filter(Boolean);
var solid = all.filter(function (x) { return x[3] >= 0.99; });
var list = solid.length ? solid : all;
if (!list.length) return null;
return side === 'top' ? list[0] : list[list.length - 1];
}
function mix(a, b, t) { return [0, 1, 2].map(function (i) { return Math.round(a[i] * (1 - t) + b[i] * t); }); }
function css(c) { return 'rgb(' + c[0] + ',' + c[1] + ',' + c[2] + ')'; }
function dist(a, b) { return Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]) + Math.abs(a[2] - b[2]); }
function lum(c) { return (c[0] * 299 + c[1] * 587 + c[2] * 114) / 1000; }
var VIOLET = [152, 120, 193], LAVENDER = [193, 167, 232];
var sel = '#cover, .banner-1, .banner-2, .section, section#convince, #footer';
var els = Array.prototype.slice.call(document.querySelectorAll(sel)).filter(function (e) {
return !e.parentElement.closest(sel) && e.offsetHeight > 0;
}).map(function (e) { return e.classList.contains('section--carousel') ? e.parentElement : e; });
var seps = [];
for (var i = 1; i < els.length; i++) {
var A = els[i - 1], B = els[i];
if (A.querySelector('.ann-waves')) continue;
var ca = edge(A, 'bottom'), cb = edge(B, 'top');
if (!ca || !cb || dist(ca, cb) < 14) continue;
var light = lum(cb) > 160 || lum(ca) > 160;
var back = light ? LAVENDER : VIOLET;
var midc = mix(light ? VIOLET : ca, cb, 0.45);
var html = '<div class="sw-sep" aria-hidden="true" style="background:' + css(ca) + '">' +
'<svg viewBox="0 480 1440 246" preserveAspectRatio="none" focusable="false">' +
'<g class="s1"><use href="#ec-hb" fill="' + css(back) + '"/></g>' +
'<g class="s2"><use href="#ec-hm" fill="' + css(midc) + '"/></g>' +
'<g class="s3"><use href="#ec-hf" fill="' + css(cb) + '"/></g></svg></div>';
A.insertAdjacentHTML('afterend', html);
seps.push(A.nextElementSibling);
}
document.documentElement.classList.add('sw-on');
if ('IntersectionObserver' in window) {
var io = new IntersectionObserver(function (es) {
es.forEach(function (e) { e.target.classList.toggle('sw-paused', !e.isIntersecting); });
});
seps.forEach(function (s) { io.observe(s); });
}
})();
</script>
