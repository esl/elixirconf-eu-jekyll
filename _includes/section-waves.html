<!-- Animated wave dividers on every section: same look as the Announcements waves. Decorative, behind content, ignores the pointer, pauses off screen. -->
<style>
.sw-defs{position:absolute;width:0;height:0;overflow:hidden}
.sw-host{position:relative;isolation:isolate}
.sw-waves{position:absolute;left:0;right:0;bottom:0;height:300px;max-height:100%;overflow:hidden;z-index:-1;pointer-events:none}
.sw-waves svg{position:absolute;left:0;bottom:0;width:200%;height:100%;filter:drop-shadow(0 -4px 14px rgba(233,77,139,.18))}
.sw-waves .w1{animation:swwave 16s linear infinite}
.sw-waves .w2{animation:swwave 24s linear infinite reverse}
.sw-waves .w3{animation:swwave 34s linear infinite;opacity:.9}
.sw-paused .sw-waves svg{animation-play-state:paused}
@keyframes swwave{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.sw-waves svg{animation:none!important}}
</style>
<svg class="sw-defs" aria-hidden="true"><defs>
<linearGradient id="swW1" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#ffffff" stop-opacity=".55"/><stop offset=".35" stop-color="#9769c9" stop-opacity=".22"/><stop offset="1" stop-color="#9769c9" stop-opacity=".04"/></linearGradient>
<linearGradient id="swW2" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#e94d8b" stop-opacity=".16"/><stop offset="1" stop-color="#9769c9" stop-opacity=".03"/></linearGradient>
<linearGradient id="swW3" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#9ad7d8" stop-opacity=".22"/><stop offset="1" stop-color="#9ad7d8" stop-opacity=".02"/></linearGradient>
</defs></svg>
<script>
(function () {
    var html = '<div class="sw-waves" aria-hidden="true">' +
        '<svg class="w3" viewBox="0 0 2400 300" preserveAspectRatio="none"><path fill="url(#swW3)" d="M0 140 C 200 85 400 85 600 140 C 800 195 1000 195 1200 140 C 1400 85 1600 85 1800 140 C 2000 195 2200 195 2400 140 L2400 300 L0 300 Z"/></svg>' +
        '<svg class="w2" viewBox="0 0 2400 300" preserveAspectRatio="none"><path fill="url(#swW2)" d="M0 175 C 200 130 400 130 600 175 C 800 220 1000 220 1200 175 C 1400 130 1600 130 1800 175 C 2000 220 2200 220 2400 175 L2400 300 L0 300 Z"/></svg>' +
        '<svg class="w1" viewBox="0 0 2400 300" preserveAspectRatio="none"><path fill="url(#swW1)" d="M0 205 C 200 167 400 167 600 205 C 800 243 1000 243 1200 205 C 1400 167 1600 167 1800 205 C 2000 243 2200 243 2400 205 L2400 300 L0 300 Z"/></svg></div>';
    var hosts = [];
    document.querySelectorAll('.section, .banner-2').forEach(function (s) {
        if (s.id === 'cover' || s.id === 'announcements' || s.querySelector('.sw-waves')) return;
        s.classList.add('sw-host');
        s.insertAdjacentHTML('beforeend', html);
        hosts.push(s);
    });
    if ('IntersectionObserver' in window) {
        var io = new IntersectionObserver(function (es) {
            es.forEach(function (e) { e.target.classList.toggle('sw-paused', !e.isIntersecting); });
        });
        hosts.forEach(function (h) { h.classList.add('sw-paused'); io.observe(h); });
    }
})();
</script>
