<!-- Animated wave transitions between sections.
     At the bottom of every section a wave in the colour of the next section flows into it,
     with two translucent layers moving at different speeds. Sits at the bottom of each section, so it never covers a heading. Replaces the static wave edges (hidden once the script runs).
     Decorative: behind content, ignores the pointer, pauses off screen, off for prefers-reduced-motion. -->
<style>
:root{--sw-h:clamp(80px,9vw,170px);--sw-sm:clamp(56px,6vw,90px)}
.sw-trans{position:absolute;left:0;right:0;bottom:-1px;height:var(--sw-h);overflow:hidden;z-index:-1;pointer-events:none;transform:scaleY(-1)}
.sw-trans.sw-sm{height:var(--sw-sm)}
.sw-host{position:relative;isolation:isolate}
.sw-host:not(.banner-1):not(.banner-2){padding-bottom:calc(var(--sw-h) + 1.5em)!important}
.sw-host + *{margin-top:-1px}
#convince{padding-top:48px!important}
.banner-2.sw-host,.banner-1.sw-host{padding-bottom:calc(var(--sw-sm) + .6em)!important}
/* hero, Call for Talks, hero and Call for Talks share one continuous dark background, so there are no hard seams between them */
#cft{background:linear-gradient(180deg,#201042 0,#2c1649 100%)!important}
.sw-trans svg{position:absolute;left:0;top:0;width:200%;height:100%;display:block}
.sw-trans .l1,.sw-trans .l2,.sw-trans .l3{animation:swflow 30s linear infinite}
.sw-trans .l2{animation-delay:-3s}
.sw-trans .l3{animation-delay:-6s}
.sw-paused .sw-trans svg{animation-play-state:paused}
@keyframes swflow{from{transform:translateX(0)}to{transform:translateX(-50%)}}
@media (prefers-reduced-motion:reduce){.sw-trans svg{animation:none!important}}
.sw-on #welcome::before,.sw-on #video::before,.sw-on #tickets::before,.sw-on #cft::before,.sw-on #cft::after,.sw-on #convince::before{display:none!important}
</style>
<script>
(function () {
    function rgb(s) { var m = s.match(/rgba?\(\s*(\d+)[,\s]+(\d+)[,\s]+(\d+)(?:[,\/\s]+([\d.]+))?/); return m ? [+m[1], +m[2], +m[3], m[4] === undefined ? 1 : +m[4]] : null; }
    function edge(el, side) {
        var cs = getComputedStyle(el), c = rgb(cs.backgroundColor);
        if (c && c[3] > 0.5) return c;
        var all = (cs.backgroundImage.match(/rgba?\([^)]*\)/g) || []).map(rgb).filter(Boolean);
        var solid = all.filter(function (x) { return x[3] >= 0.99; });
        var list = solid.length ? solid : all;
        if (!list.length) return null;
        return side === 'top' ? list[0] : list[list.length - 1];
    }
    function css(c, a) { return 'rgba(' + c[0] + ',' + c[1] + ',' + c[2] + ',' + (a === undefined ? 1 : a) + ')'; }
    function dist(a, b) { return Math.abs(a[0] - b[0]) + Math.abs(a[1] - b[1]) + Math.abs(a[2] - b[2]); }
    function path(base, amp, H) {
        var d = 'M0 0 L0 ' + base;
        for (var i = 0; i < 4; i++) {
            var up = i % 2 === 0 ? -1 : 1, x = i * 600;
            d += ' C ' + (x + 200) + ' ' + (base + up * amp) + ' ' + (x + 400) + ' ' + (base + up * amp) + ' ' + (x + 600) + ' ' + base;
        }
        return d + ' L2400 0 Z';
    }
    var sel = '#cover, .banner-1, .banner-2, .section, section#convince, #footer';
    var els = Array.prototype.slice.call(document.querySelectorAll(sel)).filter(function (e) {
        return !e.parentElement.closest(sel) && e.offsetHeight > 0;
    }).map(function (e) { return e.classList.contains('section--carousel') ? e.parentElement : e; });
    var hosts = [];
    for (var i = 1; i < els.length; i++) {
        var A = els[i - 1], B = els[i];
        if (A.querySelector('.ann-waves') || A.querySelector(':scope > .sw-trans')) continue;
        var ca = edge(A, 'bottom'), cb = edge(B, 'top'); var small = /banner/.test(A.className) && !/section/.test(A.className);
        if (!ca || !cb || dist(ca, cb) < 14) continue;
        var H = 200, mid = [Math.round((ca[0] + cb[0]) / 2), Math.round((ca[1] + cb[1]) / 2), Math.round((ca[2] + cb[2]) / 2)];
        var svg = function (cls, fill, p) {
            return '<svg class="' + cls + '" viewBox="0 0 2400 ' + H + '" preserveAspectRatio="none"><path fill="' + fill + '" d="' + p + '"/></svg>';
        };
        var html = '<div class="sw-trans" aria-hidden="true">' +
            svg('l3', 'rgba(151,105,201,.38)', path(140, 22, H)) +
            svg('l2', 'rgba(233,77,139,.20)', path(112, 22, H)) +
            svg('l1', css(cb, 1), path(84, 22, H)) + '</div>';
        if (small) html = html.replace('class="sw-trans"', 'class="sw-trans sw-sm"');
        A.classList.add('sw-host');
        A.insertAdjacentHTML('beforeend', html);
        hosts.push(A);
    }
    document.documentElement.classList.add('sw-on');
    if ('IntersectionObserver' in window) {
        var io = new IntersectionObserver(function (es) {
            es.forEach(function (e) { e.target.classList.toggle('sw-paused', !e.isIntersecting); });
        });
        hosts.forEach(function (h) { h.classList.add('sw-paused'); io.observe(h); });
    }
})();
</script>
