<!-- The modal -->
<div id="myModal" class="modal">
  <div class="modal-content" style="background-color: #201042; border-radius: 8px; padding: 2em 1.5em">
    <span class="close">&times;</span>
    <!-- modal content here -->
    <h3 class="title">Call for Talks is open</h3>
    <p style="color: #fff; line-height: 1.6">ElixirConf EU 2027 takes place on 22-23 April in Lisbon. Submit your talk proposal by 15 December.</p>

    <a class="modal-action btn-outline btn-orange inline-block" style="margin: 1.2em 0 0.8em" href="https://sessionize.com/elixirconf-eu-2027/" target="_blank">
      SUBMIT A TALK
    </a>
    <br />
    <a class="modal-action btn-outline btn-purple inline-block" style="margin: 0.8em 0" href="#newsletter">
      JOIN THE WAITING LIST
    </a>
    <p style="color: #fff; margin-top: 1.5em">Follow us</p>
    <p style="margin-bottom: 0.5em">
      <a href="https://www.linkedin.com/company/elixirconf" target="_blank" style="color: #9ad7d8; margin: 0 0.6em">LinkedIn</a>
      <a href="https://bsky.app/profile/elixirconf.bsky.social" target="_blank" style="color: #9ad7d8; margin: 0 0.6em">Bluesky</a>
      <a href="https://twitter.com/elixirconfeu" target="_blank" style="color: #9ad7d8; margin: 0 0.6em">X</a>
    </p>
  </div>
</div>

<script>
  // Get the modal element
  var modal = document.getElementById("myModal");

  // Get the <span> element that closes the modal
  var closeBtn = document.getElementsByClassName("close")[0];

  // Function to open the modal
  function openModal() {
    modal.style.display = "block";
  }

  // Function to close the modal
  function closeModal() {
    modal.style.display = "none";
  }

  // Event listener to close the modal when the close button is clicked
  closeBtn.addEventListener("click", closeModal);
  document.querySelectorAll(".modal-action").forEach(function (el) {
    el.addEventListener("click", closeModal);
  });

  // Event listener to close the modal when clicking on the backdrop
  window.addEventListener("click", function (event) {
    if (event.target === modal) {
      closeModal();
    }
  });

  // Event listener to close the modal when the "Escape" key is pressed
  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape") {
      closeModal();
    }
  });

  // Open the modal after given modal seconds
   setTimeout(openModal, "{{ site.data.settings.homepage_settings.modal.delay }}");
</script>
