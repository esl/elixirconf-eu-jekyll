<!-- The modal -->
<style>
#myModal.modal{background-color:rgba(20,10,46,.82)}
#myModal .cfp-card{position:relative;width:calc(100% - 2em);max-width:560px;margin:5vh auto;padding:0;background:#7841ae;border-radius:24px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6);text-align:center;font-family:Montserrat,sans-serif}
#myModal .cfp-head{position:relative;overflow:hidden;height:420px;background:#4d1484}
#myModal .cfp-photo{position:absolute;left:-57.5%;top:-164px;width:223.2%;max-width:none;height:auto}
#myModal .cfp-ov{position:absolute;inset:0;background:rgba(62,46,115,.75)}
#myModal .cfp-logo{position:absolute;left:10%;top:96px;width:80%;z-index:2}
#myModal .cfp-date{position:absolute;left:0;right:0;top:216px;margin:0;z-index:2;color:#fff;font-size:19px;font-weight:700}
#myModal .cfp-hills{position:absolute;left:0;bottom:-1px;width:100%;height:150px;display:block}
#myModal .m27-l1,#myModal .m27-l2,#myModal .m27-l3{transform-box:view-box;transform-origin:50% 100%}
#myModal .m27-l1{animation:m27drift 15s ease-in-out infinite alternate}
#myModal .m27-l2{animation:m27drift 11s ease-in-out infinite alternate-reverse}
#myModal .m27-l3{animation:m27drift 8s ease-in-out infinite alternate}
@keyframes m27drift{from{transform:scale(1.04,1) translateX(-1.1%)}to{transform:scale(1.04,1) translateX(1.1%)}}
@media (prefers-reduced-motion:reduce){#myModal .m27-l1,#myModal .m27-l2,#myModal .m27-l3{animation:none;transform:scale(1.04,1)}}
#myModal .close{position:absolute;top:16px;right:16px;z-index:5;width:44px;height:44px;line-height:42px;text-align:center;border-radius:50%;background:rgba(77,20,132,.85);color:#fff;font-size:26px;float:none;opacity:1;text-shadow:none;cursor:pointer}
#myModal .cfp-body{padding:4px 40px 40px;background:#7841ae}
#myModal .cfp-body h3{margin:0 0 14px;color:#fff;font-family:Montserrat,sans-serif;font-size:36px;font-weight:800;line-height:1.1}
#myModal .cfp-body p{margin:0 auto 24px;max-width:24em;color:#fff;font-family:Montserrat,sans-serif;font-size:20px;line-height:1.45}
#myModal a.cfp-btn{display:flex;align-items:center;justify-content:center;box-sizing:border-box;width:100%;margin:0 auto 14px;border-radius:15px;font-family:Montserrat,sans-serif;text-transform:uppercase;text-decoration:none;transition:background .2s,color .2s}
#myModal a.cfp-btn.primary{height:72px;background:#f0cf5a;color:#fff;font-size:28px;font-weight:800}
#myModal a.cfp-btn.primary:hover{background:#fff;color:#5a3181}
#myModal a.cfp-btn.secondary{height:62px;border:3px solid #f0cf5a;color:#f0cf5a;font-size:20px;font-weight:400}
#myModal a.cfp-btn.secondary:hover{background:#f0cf5a;color:#4d1484}
#myModal .cfp-social{display:flex;justify-content:center;align-items:center;gap:14px;margin-top:22px}
#myModal .cfp-social span{color:#fff;font-size:16px;margin-right:4px}
#myModal .cfp-social a{display:flex;align-items:center;justify-content:center;width:44px;height:44px;border-radius:50%;background:#5a3181;transition:background .2s}
#myModal .cfp-social a:hover{background:#e84f8b}
#myModal .cfp-social svg{width:18px;height:18px;fill:#fff}
@media (max-width:600px){#myModal .cfp-head{height:330px}#myModal .cfp-logo{top:70px}#myModal .cfp-date{top:170px;font-size:16px}#myModal .cfp-hills{height:110px}#myModal .cfp-body{padding:4px 22px 28px}#myModal .cfp-body h3{font-size:28px}#myModal .cfp-body p{font-size:17px}#myModal a.cfp-btn.primary{height:60px;font-size:22px}#myModal a.cfp-btn.secondary{height:54px;font-size:16px}}
</style>

<script>
  // Get the modal element
  var modal = document.getElementById("myModal");

  // Get the <span> element that closes the modal
  var closeBtn = document.getElementsByClassName("close")[0];

  // Function to open the modal
  function openModal() {
    modal.style.display = "block";
  }

  // Function to close the modal
  function closeModal() {
    modal.style.display = "none";
  }

  // Event listener to close the modal when the close button is clicked
  closeBtn.addEventListener("click", closeModal);
  document.querySelectorAll(".modal-action").forEach(function (el) {
    el.addEventListener("click", closeModal);
  });

  // Event listener to close the modal when clicking on the backdrop
  window.addEventListener("click", function (event) {
    if (event.target === modal) {
      closeModal();
    }
  });

  // Event listener to close the modal when the "Escape" key is pressed
  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape") {
      closeModal();
    }
  });

  // Open the modal after given modal seconds
   setTimeout(openModal, "{{ site.data.settings.homepage_settings.modal.delay }}");
</script>
