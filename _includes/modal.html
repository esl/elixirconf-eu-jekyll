<!-- The modal -->
<div id="myModal" class="modal">
  <div class="modal-content" style="background-color: #201042; border-radius: 8px">
    <span class="close">&times;</span>
    <!-- modal content here -->
    <img src="{{ site.baseurl }}/assets/images/jose-valim.jpg" alt="José Valim, ElixirConf EU speaker" style="width: 140px; height: 140px; border-radius: 50%; border: 6px solid #9ad7d8; object-fit: cover; margin-top: 10px" />
    <h3 class="title">Call for Talks is open</h3>
    <p style="color: #fff">ElixirConf EU 2027 takes place on 22-23 April in Lisbon. Submit your talk proposal by 15 December.</p>

    <a id="btn-modal" class="btn-outline btn-orange mb-4 mt-4 inline-block" href="https://sessionize.com/elixirconf-eu-2027/" target="_blank">
      SUBMIT A TALK
    </a>
  </div>
</div>

<script>
  // Get the modal element
  var modal = document.getElementById("myModal");

  // Get the <span> element that closes the modal
  var closeBtn = document.getElementsByClassName("close")[0];
  var btn = document.getElementById('btn-modal')

  // Function to open the modal
  function openModal() {
    modal.style.display = "block";
  }

  // Function to close the modal
  function closeModal() {
    modal.style.display = "none";
  }

  // Event listener to close the modal when the close button is clicked
  closeBtn.addEventListener("click", closeModal);
  btn.addEventListener("click", closeModal);

  // Event listener to close the modal when clicking on the backdrop
  window.addEventListener("click", function (event) {
    if (event.target === modal) {
      closeModal();
    }
  });

  // Event listener to close the modal when the "Escape" key is pressed
  document.addEventListener("keydown", function (event) {
    if (event.key === "Escape") {
      closeModal();
    }
  });

  // Open the modal after given modal seconds
   setTimeout(openModal, "{{ site.data.settings.homepage_settings.modal.delay }}");
</script>
