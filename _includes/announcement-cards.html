<div class="ann-wrap">
<svg class="ann-wave" viewBox="0 0 1200 400" preserveAspectRatio="none" aria-hidden="true">
<defs><linearGradient id="annGrad" x1="0" x2="1" y1="0" y2="0"><stop offset="0" stop-color="#e94d8b"/><stop offset=".5" stop-color="#b58be0"/><stop offset="1" stop-color="#9ad7d8"/></linearGradient></defs>
<path class="glass" pathLength="1000" d="M-20 200 C 150 60, 300 340, 480 200 S 800 60, 960 200 S 1130 330, 1220 190"/>
<path class="edge" pathLength="1000" d="M-20 200 C 150 60, 300 340, 480 200 S 800 60, 960 200 S 1130 330, 1220 190"/>
<path class="glow" pathLength="1000" d="M-20 200 C 150 60, 300 340, 480 200 S 800 60, 960 200 S 1130 330, 1220 190"/>
<path class="core" pathLength="1000" d="M-20 200 C 150 60, 300 340, 480 200 S 800 60, 960 200 S 1130 330, 1220 190"/>
</svg>
<div class="ann-grid">
{% assign items = site.data.announcements %}
{% if include.limit %}{% assign items = items | slice: 0, include.limit %}{% endif %}
{% for a in items %}
<article class="ann-card">
    <span class="ann-date">{{ a.date | date: "%-d %b %Y" }}</span>
    <h3>{{ a.title }}</h3>
    <p>{{ a.text }}</p>
    <a class="ann-cta" href="{{ a.link }}" target="_blank" rel="noopener">{{ a.cta }} &rarr;</a>
</article>
{% endfor %}
</div>
</div>
